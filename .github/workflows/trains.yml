# Keeps the MahFamily train timetable fresh for free: public repos do not pay for Actions minutes.
# Builds transit/trains.json (14 days of Israel Railways, from the Ministry of Transport GTFS) and
# commits it. The app reads https://mahfamily-fd2ab.web.app/transit/trains.json, which Firebase
# Hosting redirects to raw.githubusercontent.com/mathu79/MahFamily-download/main/transit/trains.json.
# The weekly commit also keeps the schedule alive (GitHub pauses schedules after 60 idle days).
name: Train timetable
on:
  schedule:
    - cron: '17 1 * * 0,3' # Sunday and Wednesday, about 03:17 Israel time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trains
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build timetable
        run: python3 scripts/build-trains.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add transit/trains.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Train timetable $(date -u +%Y-%m-%d)"
          git push
